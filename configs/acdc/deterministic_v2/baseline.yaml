trainer:
  default_root_dir: outputs/acdc_v2/baseline
  max_epochs: 400
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  precision: 16-mixed
  callbacks:
  - class_path: training.acdc_checkpoint.ACDCModelCheckpoint
    init_args:
      every_n_epochs: 1
      save_top_k: 1
      filename: best_test
      auto_insert_metric_name: false
      enable_version_counter: false
      monitor: metrics/test_mean_dice
      mode: max
      save_last: true
      save_weights_only: true
  - class_path: training.acdc_test_logger.ACDCTestLogger
    init_args:
      history_filename: acdc_test_history.csv
      best_filename: acdc_best_result.txt
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/acdc_v2/baseline
      name: acdc_baseline_v2
model:
  class_path: training.acdc_mask_classification_semantic.ACDCMaskClassificationSemantic
  init_args:
    num_classes: 4
    img_size:
    - 224
    - 224
    attn_mask_annealing_enabled: false
    ignore_idx: 255
    lr: 5e-4
    weight_decay: 0.05
    network:
      class_path: models.eoseg.EoSegMultiQSegFusion
      init_args:
        num_classes: 4
        num_q: 6
        encoder:
          class_path: models.vit.ViT
          init_args:
            img_size:
            - 224
            - 224
data:
  class_path: datasets.acdc_semantic.ACDCSemantic
  init_args:
    base_dir: ACDC
    list_dir: ACDC/lists_ACDC
    img_size:
    - 224
    - 224
    num_classes: 4
    batch_size: 16
    num_workers: 8
    ignore_idx: 255
    drop_background: false
    make_rgb: true
deterministic_enabled: true
deterministic_protocol: acdc_ce2d_stableseg_execution_v2
deterministic_profile: baseline
deterministic_probe_batches: 0
deterministic_output_dir: outputs/determinism/acdc_ce2d_stableseg_execution_v2/baseline
deterministic_readiness: outputs/determinism/acdc_ce2d_stableseg_execution_v2/readiness.json
roi_metrics: true
