trainer:
  default_root_dir: outputs/asee
  max_epochs: 400
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  precision: 16-mixed
  callbacks:
  - class_path: training.acdc_checkpoint.ACDCModelCheckpoint
    init_args:
      every_n_epochs: 1
      save_top_k: 1
      filename: best_test
      auto_insert_metric_name: false
      enable_version_counter: false
      monitor: metrics/test_mean_dice
      mode: max
      save_last: true
      save_weights_only: true
  - class_path: training.acdc_test_logger.ACDCTestLogger
    init_args:
      history_filename: acdc_test_history.csv
      best_filename: acdc_best_result.txt
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/asee
      name: acdc_asee
model:
  class_path: training.acdc_mask_classification_semantic.ACDCMaskClassificationSemantic
  init_args:
    num_classes: 4
    img_size:
    - 224
    - 224
    attn_mask_annealing_enabled: false
    ignore_idx: 255
    lr: 5e-4
    weight_decay: 0.05
    network:
      class_path: models.eoseg_asee.EoSegMultiQSegFusionASEE
      init_args:
        num_classes: 4
        num_q: 6
        encoder:
          class_path: models.vit.ViT
          init_args:
            img_size:
            - 224
            - 224
        prior_path: priors/acdc_asee_80_20_v1.pt
        queries_per_class: 2
        patch_update: plan
        freeze_text_projection: false
        enhance_patch: true
        enhance_query: true
        use_text: true
        use_probability: true
data:
  class_path: datasets.acdc_semantic.ACDCSemantic
  init_args:
    base_dir: ACDC
    list_dir: ACDC/lists_ACDC
    img_size:
    - 224
    - 224
    num_classes: 4
    batch_size: 16
    num_workers: 8
    ignore_idx: 255
    drop_background: false
    make_rgb: true
